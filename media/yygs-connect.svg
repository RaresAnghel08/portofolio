<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="#13306b"/>

  <!-- Globe -->
  <defs>
    <radialGradient id="g" cx="36%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#d6e8ff"/>
      <stop offset="45%" stop-color="#7aaae8"/>
      <stop offset="100%" stop-color="#4a72c0"/>
    </radialGradient>
    <clipPath id="c">
      <circle cx="32" cy="32" r="13"/>
    </clipPath>
  </defs>
  <circle cx="32" cy="32" r="13" fill="url(#g)"/>
  <g clip-path="url(#c)">
    <ellipse cx="30" cy="29" rx="8" ry="6" fill="#5c9b52" opacity="0.75"/>
    <ellipse cx="34" cy="36" rx="7" ry="5" fill="#5c9b52" opacity="0.70"/>
  </g>
  <circle cx="32" cy="32" r="13" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>

  <!-- Connection lines (hexagon) -->
  <!-- Orbit r=24 from (32,32) -->
  <!-- A(32,8) B(52,20) C(52,44) D(32,56) E(12,44) F(12,20) -->
  <line x1="32" y1="8"  x2="52" y2="20" stroke="rgba(100,180,255,0.30)" stroke-width="1"/>
  <line x1="52" y1="20" x2="52" y2="44" stroke="rgba(100,180,255,0.30)" stroke-width="1"/>
  <line x1="52" y1="44" x2="32" y2="56" stroke="rgba(100,180,255,0.30)" stroke-width="1"/>
  <line x1="32" y1="56" x2="12" y2="44" stroke="rgba(100,180,255,0.30)" stroke-width="1"/>
  <line x1="12" y1="44" x2="12" y2="20" stroke="rgba(100,180,255,0.30)" stroke-width="1"/>
  <line x1="12" y1="20" x2="32" y2="8"  stroke="rgba(100,180,255,0.30)" stroke-width="1"/>

  <!-- Avatar dots -->
  <circle cx="32" cy="8"  r="5" fill="#b8d0f7" stroke="white" stroke-width="1.5"/>
  <circle cx="52" cy="20" r="5" fill="#f7c5b8" stroke="white" stroke-width="1.5"/>
  <circle cx="52" cy="44" r="5" fill="#c5f7b8" stroke="white" stroke-width="1.5"/>
  <circle cx="32" cy="56" r="5" fill="#f7f0b8" stroke="white" stroke-width="1.5"/>
  <circle cx="12" cy="44" r="5" fill="#e0b8f7" stroke="white" stroke-width="1.5"/>
  <circle cx="12" cy="20" r="5" fill="#b8f0f7" stroke="white" stroke-width="1.5"/>
</svg>
